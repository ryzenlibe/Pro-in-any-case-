<!DOCTYPE html>
<html lang="en">
<head>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #000;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  overflow-x: hidden;
}

.page {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  background: #000;
}

.video-box {
  width: 100%;
}

video {
  width: 100%;
  max-height: 75vh;
  object-fit: contain;
  display: block;
  background: #000;
}

video::-webkit-media-controls-fullscreen-button,
video::-webkit-media-controls-overflow-button {
  display: none !important;
}

.rec-title {
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  padding: 16px 15px 6px;
}

.banner-300 {
  display: flex;
  justify-content: center;
  padding: 15px 0;
}

.native-wrap {
  padding: 10px;
  display: flex;
  justify-content: center;
  padding-bottom: 30px;
}
</style>
</head>

<body>

<div class="page">

  <!-- VIDEO -->
  <div class="video-box">
    <video
      id="player"
      controls
      autoplay
      muted
      playsinline
      preload="metadata"
      poster="https://via.placeholder.com/480x720?text=Loading..."
      controlsList="nodownload noremoteplayback"
      disablePictureInPicture
    >
      <source id="videoSource" src="" type="video/mp4">
    </video>
  </div>

  <div class="rec-title">
    🔥 Trending Videos
  </div>

  <!-- ✅ BANNER 300x250 -->
  <div class="banner-300">
    <script>
      atOptions = {
        'key' : 'b3a0a1af6d7d4ee79a75aba43a97e0fb',
        'format' : 'iframe',
        'height' : 250,
        'width' : 300,
        'params' : {}
      };
    </script>
    <script src="https://zealoushavoc.com/b3a0a1af6d7d4ee79a75aba43a97e0fb/invoke.js"></script>
  </div>

  <!-- ✅ NATIVE BANNER -->
  <div class="native-wrap">
    <script async="async" data-cfasync="false" src="https://zealoushavoc.com/200138cb98041e918b93cbf8e0cc96cf/invoke.js"></script>
    <div id="container-200138cb98041e918b93cbf8e0cc96cf"></div>
  </div>

</div>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  let videoParam = params.get("v");
  let videoUrl = "https://cdn.videy.co/k84OOz1w1.mp4"; // Default fallback

  if (videoParam) {
    // Sanitasi sederhana untuk mencegah karakter aneh
    videoParam = encodeURI(videoParam);
    
    if (videoParam.startsWith("http://") || videoParam.startsWith("https://")) {
      videoUrl = videoParam;
    } else {
      videoUrl = "https://cdn.videy.co/" + videoParam;
    }
  }

  const player = document.getElementById("player");
  const source = document.getElementById("videoSource");

  // Memasang source dan memuat video
  source.src = videoUrl;
  player.load();

  // Memaksa playback setelah siap
  player.play().catch(error => {
    console.log("Autoplay blocked by browser:", error);
  });

  // Anti klik kanan pada elemen video
  player.addEventListener("contextmenu", e => e.preventDefault());
})();
</script>

</body>
</html>
